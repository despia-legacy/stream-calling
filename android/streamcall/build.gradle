// Engineer-owned module build. Stream Video Android 1.35.0 and stream-android-push-firebase 1.3.4 are
// the newest versions on Maven Central (read 2026-11-20:
// https://repo1.maven.org/maven2/io/getstream/stream-video-android-core/maven-metadata.xml, release
// 1.35.0, lastUpdated 20260929153335; .../stream-android-push-firebase/maven-metadata.xml, release 1.3.4,
// lastUpdated 20260310195827; GitHub releases https://github.com/GetStream/stream-video-android/releases/tag/v1.35.0
// of 2026-09-29 and https://github.com/GetStream/stream-android-push/releases/tag/1.3.4 of 2026-03-10).
// Newer versions (1.36.0 to 1.38.0, push 1.3.5) are published only on Stream's own Maven repository; the
// Despia build accepts only the default Maven repositories, so this template takes Central's newest.
// A customer may use the newer versions by adding Stream's repository in their own build.
// Firebase uses the base app's own BoM; coroutines, core, activity, appcompat and material are the base's coordinates
// (the base already resolves coroutines to 1.9.0 or newer through lifecycle 2.10.0, the floor Stream asks for).
apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace 'despia.ext.streamcall'
    compileSdk 36
    defaultConfig {
        minSdk 24
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation project(':nativeext-api')
    implementation 'io.getstream:stream-video-android-core:1.35.0'
    implementation 'io.getstream:stream-android-push-firebase:1.3.4'
    implementation platform('com.google.firebase:firebase-bom:34.11.0')
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'androidx.core:core:1.18.0'
    implementation 'androidx.activity:activity:1.13.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'
}
